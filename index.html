  color:var(--parch);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  padding-bottom:88px;}
.cat-app *{font-family:inherit;}
.wrap{max-width:620px;margin:0 auto;padding:0 18px;}

/* header */
.header{position:sticky;top:0;z-index:30;background:rgba(15,20,29,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);}
.header-in{max-width:620px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.brand{display:flex;align-items:center;gap:11px;min-width:0;}
.brand h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:23px;line-height:1;margin:0;letter-spacing:.3px;color:var(--parch);}
.brand .sub{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--parch-faint);margin-top:3px;}
.bars{display:flex;gap:2.5px;height:26px;align-items:stretch;}
.bars i{width:3.5px;border-radius:1px;background:linear-gradient(180deg,var(--gold-2),var(--gold-deep));display:block;}
.bars.lg{height:34px;}.bars.lg i{width:5px;gap:3px;}
.toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--ink-2);
  color:var(--parch-dim);border-radius:999px;padding:7px 11px;font-size:11.5px;font-weight:600;cursor:pointer;letter-spacing:.4px;white-space:nowrap;}
.toggle.on{color:var(--ink);background:linear-gradient(180deg,var(--gold-2),var(--gold));border-color:transparent;}
.toggle svg{width:14px;height:14px;}

/* generic */
.eyebrow{font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold);font-weight:600;}
.h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;line-height:1.06;margin:6px 0 0;color:var(--parch);}
.h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:25px;line-height:1.1;margin:0;color:var(--parch);}
.mono{font-family:'Space Mono',monospace;}
.es-sub{display:block;font-size:12.5px;color:var(--gold);opacity:.82;margin-top:4px;font-style:italic;}
.es-inline{color:var(--gold);opacity:.8;font-style:italic;font-weight:400;}
.dim{color:var(--parch-dim);}
.faint{color:var(--parch-faint);}

.dropcap{float:left;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:62px;line-height:.78;
  margin:6px 12px 0 0;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.3);}

.card{background:linear-gradient(180deg,var(--ink-2),rgba(21,29,40,.6));border:1px solid var(--line);
  border-radius:16px;padding:18px;}
.section{padding:22px 0;}
.section-pad{padding-top:18px;}

.btn{appearance:none;border:1px solid var(--line-2);background:var(--ink-3);color:var(--parch);
  border-radius:12px;padding:13px 16px;font-size:15px;font-weight:600;cursor:pointer;width:100%;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s ease, border-color .15s;}
.btn:active{transform:scale(.985);}
.btn svg{width:18px;height:18px;}
.btn-gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#241c08;border-color:transparent;}
.btn-ghost{background:transparent;}
.btn-sm{width:auto;padding:9px 13px;font-size:13px;border-radius:10px;}
.row{display:flex;gap:10px;}
.row>.btn{flex:1;}

.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--ink-2);
  color:var(--parch-dim);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:.12s;}
.pill.on{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#241c08;border-color:transparent;}
.pill-wrap{display:flex;flex-wrap:wrap;gap:8px;}
.pill.sang.on{background:linear-gradient(180deg,var(--sang-2),var(--sang));color:#fff;}

/* progress four-bars */
.pbar{display:flex;gap:4px;height:10px;}
.pbar i{flex:1;border-radius:2px;background:var(--ink-4);overflow:hidden;}
.pbar i.fill{background:linear-gradient(180deg,var(--gold-2),var(--gold-deep));}

/* tool grid */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tool{background:linear-gradient(160deg,var(--ink-2),rgba(28,39,52,.5));border:1px solid var(--line);
  border-radius:16px;padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:118px;
  transition:transform .1s ease,border-color .15s;}
.tool:active{transform:scale(.98);}
.tool .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:var(--gold-glow);border:1px solid rgba(201,162,63,.3);color:var(--gold-2);}
.tool .ic svg{width:20px;height:20px;}
.tool b{font-size:16px;font-weight:600;color:var(--parch);}
.tool span{font-size:12.5px;color:var(--parch-dim);line-height:1.3;}
.tool.wide{grid-column:span 2;flex-direction:row;align-items:center;min-height:auto;}
.tool.wide .txt{flex:1;}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.stat{background:var(--ink-2);border:1px solid var(--line);border-radius:13px;padding:13px;text-align:center;}
.stat .v{font-family:'Space Mono',monospace;font-size:24px;font-weight:700;color:var(--gold-2);line-height:1;}
.stat .l{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--parch-faint);margin-top:6px;}

/* options (quiz) */
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.qprog{font-family:'Space Mono',monospace;font-size:13px;color:var(--parch-dim);}
.qtext{font-family:'Cormorant Garamond',serif;font-size:24px;line-height:1.22;color:var(--parch);font-weight:600;}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--ink-2);border:1px solid var(--line-2);
  border-radius:13px;padding:14px;cursor:pointer;color:var(--parch);font-size:15px;line-height:1.25;transition:.12s;}
.opt .k{width:24px;height:24px;flex:none;border-radius:7px;border:1px solid var(--line-2);display:grid;place-items:center;
  font-family:'Space Mono',monospace;font-size:12px;color:var(--parch-dim);}
.opt.sel{border-color:var(--gold);}
.opt.correct{border-color:var(--verd-2);background:rgba(47,107,87,.16);}
.opt.correct .k{background:var(--verd-2);color:#fff;border-color:transparent;}
.opt.wrong{border-color:var(--sang-2);background:var(--sang-glow);}
.opt.wrong .k{background:var(--sang-2);color:#fff;border-color:transparent;}
.opt.dis{opacity:.55;}
.explain{margin-top:16px;border-left:3px solid var(--gold);background:rgba(201,162,63,.07);
  padding:13px 14px;border-radius:0 12px 12px 0;font-size:14px;line-height:1.45;color:var(--parch);}
.explain .lab{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);font-weight:700;display:block;margin-bottom:5px;}

/* flashcard */
.fc{perspective:1400px;width:100%;height:340px;cursor:pointer;}
.fc-in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;}
.fc.flip .fc-in{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:18px;border:1px solid var(--line-2);padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;}
.fc-front{background:linear-gradient(165deg,var(--ink-3),var(--ink-2));}
.fc-back{background:linear-gradient(165deg,#1b2533,#141c27);transform:rotateY(180deg);border-color:rgba(201,162,63,.3);}
.fc-tag{font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold);font-weight:700;}
.fc-term{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:34px;line-height:1.08;color:var(--parch);}
.fc-def{font-size:17px;line-height:1.4;color:var(--parch);}
.fc-hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;color:var(--parch-faint);letter-spacing:.4px;}

/* timeline */
.tl{position:relative;margin-top:6px;padding-left:22px;}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;
  background:linear-gradient(180deg,var(--gold),rgba(201,162,63,.15));}
.tl-item{position:relative;padding:0 0 20px 14px;}
.tl-item:before{content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;
  background:var(--ink);border:2px solid var(--gold);}
.tl-item.sang:before{border-color:var(--sang-2);}
.tl-year{font-family:'Space Mono',monospace;font-weight:700;font-size:15px;color:var(--gold-2);}
.tl-ev{font-size:14.5px;line-height:1.35;color:var(--parch);margin-top:2px;}
.tl-era{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--parch-faint);}

/* match */
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.m-col{display:flex;flex-direction:column;gap:10px;}
.m-item{background:var(--ink-2);border:1px solid var(--line-2);border-radius:12px;padding:13px;font-size:14px;
  line-height:1.25;cursor:pointer;min-height:58px;display:flex;align-items:center;transition:.12s;color:var(--parch);}
.m-item.sel{border-color:var(--gold);background:var(--gold-glow);}
.m-item.matched{border-color:var(--verd-2);background:rgba(47,107,87,.14);opacity:.7;cursor:default;}
.m-item.bad{border-color:var(--sang-2);background:var(--sang-glow);animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(18,25,35,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:8px 0 max(8px,env(safe-area-inset-bottom));}
.nav-in{max-width:620px;margin:0 auto;display:flex;justify-content:space-around;padding:0 8px;}
.nav-btn{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--parch-faint);font-size:10.5px;font-weight:600;cursor:pointer;padding:4px 8px;flex:1;letter-spacing:.2px;}
.nav-btn svg{width:21px;height:21px;}
.nav-btn.active{color:var(--gold-2);}
.nav-bar{height:2px;width:18px;border-radius:2px;background:transparent;}
.nav-btn.active .nav-bar{background:var(--gold);}

/* language list */
.lang-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);}
.lang-ca{font-size:16px;font-weight:600;color:var(--parch);}
.lang-es{font-size:13px;color:var(--gold);opacity:.85;font-style:italic;margin-top:2px;}
.spk{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--ink-2);
  display:grid;place-items:center;color:var(--gold-2);cursor:pointer;}
.spk svg{width:17px;height:17px;}
.spk:active{background:var(--gold-glow);}

.center{text-align:center;}
.gap{height:14px;}
.gap-s{height:8px;}
.divider{height:1px;background:var(--line);margin:18px 0;}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--parch-dim);font-size:14px;font-weight:600;cursor:pointer;padding:6px 0;}
.back-btn svg{width:17px;height:17px;}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;padding:3px 9px;border-radius:999px;}
.badge.n1{background:rgba(70,150,123,.18);color:var(--verd-2);}
.badge.n2{background:rgba(201,162,63,.18);color:var(--gold-2);}
.badge.n3{background:rgba(214,83,67,.18);color:var(--sang-2);}
.ring{position:relative;width:128px;height:128px;margin:0 auto;}
`,Tc=[{id:"q01",p:"origens",n:1,q:"Quina col\xF2nia grega es va fundar a l'actual Empord\xE0 al segle VI aC?",o:["T\xE0rraco","Barcino","Emp\xFAries (Emporion)","Gerunda"],c:2,e:'Emporion ("mercat") fou fundada pels grecs focis cap al 575 aC.',qe:"\xBFQu\xE9 colonia griega se fund\xF3 en el actual Empord\xE0 en el siglo VI a.C.?",ee:'Emporion ("mercado") fue fundada por los griegos foceos hacia el 575 a.C.'},{id:"q02",p:"origens",n:1,q:"Quin poble iber ocupava el territori de l'actual Barcelona?",o:["Els laietans","Els ilergets","Els ausetans","Els cerretans"],c:0,e:"Els laietans habitaven el litoral central; els ilergets, la zona de Lleida.",qe:"\xBFQu\xE9 pueblo \xEDbero ocupaba el territorio de la actual Barcelona?",ee:"Los layetanos habitaban el litoral central; los ilergetes, la zona de Lleida."},{id:"q03",p:"origens",n:2,q:"En quin any van arribar els romans a la pen\xEDnsula per Emp\xFAries?",o:["218 aC","146 aC","27 aC","711"],c:0,e:"Gneu Escipi\xF3 desembarc\xE0 a Emp\xFAries el 218 aC, dins la Segona Guerra P\xFAnica.",qe:"\xBFEn qu\xE9 a\xF1o llegaron los romanos a la pen\xEDnsula por Emp\xFAries?",ee:"Cneo Escipi\xF3n desembarc\xF3 en Emp\xFAries en el 218 a.C., en la Segunda Guerra P\xFAnica."},{id:"q04",p:"origens",n:1,q:"Quina ciutat fou capital de la prov\xEDncia romana Tarraconense?",o:["Barcino","T\xE0rraco","Ilerda","Gerunda"],c:1,e:"T\xE0rraco (Tarragona) fou la capital de la Hisp\xE0nia Citerior Tarraconense.",qe:"\xBFQu\xE9 ciudad fue capital de la provincia romana Tarraconense?",ee:"T\xE0rraco (Tarragona) fue la capital de la Hispania Citerior Tarraconense."},{id:"q05",p:"origens",n:2,q:"Quin poble germ\xE0nic domin\xE0 el territori despr\xE9s de Roma, amb capital a Toledo?",o:["Els v\xE0ndals","Els sueus","Els visigots","Els francs"],c:2,e:"El regne visigot, amb capital a Toledo, domin\xE0 la pen\xEDnsula fins al 711.",qe:"\xBFQu\xE9 pueblo germ\xE1nico domin\xF3 el territorio tras Roma, con capital en Toledo?",ee:"El reino visigodo, con capital en Toledo, domin\xF3 la pen\xEDnsula hasta el 711."},{id:"q06",p:"origens",n:3,q:"Ind\xEDbil i Mandoni foren cabdills de quin poble iber revoltat contra Roma?",o:["Laietans","Ilergets","Indigets","Lacetans"],c:1,e:"Ind\xEDbil i Mandoni, cabdills ilergets, encap\xE7alaren revoltes contra el domini rom\xE0.",qe:"Ind\xEDbil y Mandonio fueron caudillos de \xBFqu\xE9 pueblo \xEDbero sublevado contra Roma?",ee:"Ind\xEDbil y Mandonio, caudillos ilergetes, encabezaron revueltas contra el dominio romano."},{id:"q07",p:"comtats",n:1,q:"Qu\xE8 cre\xE0 Carlemany per defensar la frontera sud del seu imperi?",o:["La Corona d'Arag\xF3","La Marca Hisp\xE0nica","El Principat","La Generalitat"],c:1,e:"La Marca Hisp\xE0nica era la zona fronterera de l'Imperi Carolingi, origen dels comtats catalans.",qe:"\xBFQu\xE9 cre\xF3 Carlomagno para defender la frontera sur de su imperio?",ee:"La Marca Hisp\xE1nica era la zona fronteriza del Imperio Carolingio, origen de los condados catalanes.",oe:["La Corona de Arag\xF3n","La Marca Hisp\xE1nica","El Principado","La Generalidad"]},{id:"q08",p:"comtats",n:2,q:"En quin any van conquerir Barcelona els francs (Llu\xEDs el Piet\xF3s)?",o:["711","801","988","1137"],c:1,e:"Llu\xEDs el Piet\xF3s, fill de Carlemany, prengu\xE9 Barcelona als musulmans el 801.",qe:"\xBFEn qu\xE9 a\xF1o conquistaron Barcelona los francos (Ludovico P\xEDo)?",ee:"Ludovico P\xEDo, hijo de Carlomagno, tom\xF3 Barcelona a los musulmanes en el 801."},{id:"q09",p:"comtats",n:1,q:"Quin comte es considera tradicionalment l'origen del Casal de Barcelona?",o:["Borrell II","Guifr\xE9 el Pel\xF3s","Ramon Berenguer IV","Jaume I"],c:1,e:"Guifr\xE9 el Pel\xF3s (s. IX) unific\xE0 diversos comtats i fund\xE0 la dinastia comtal de Barcelona.",qe:"\xBFQu\xE9 conde se considera tradicionalmente el origen de la Casa de Barcelona?",ee:"Guifr\xE9 el Pel\xF3s (s. IX) unific\xF3 varios condados y fund\xF3 la dinast\xEDa condal de Barcelona."},{id:"q10",p:"comtats",n:2,q:"Segons la llegenda, amb ampesinos y menestrales","La burgues\xEDa","Los mercaderes"]},{id:"q101",p:"institucions",n:3,q:"Com es deia el sistema pel qual el pag\xE8s renunciava a la llibertat a canvi de la protecci\xF3 del senyor?",o:["L'encomanda","El vassallatge","El cadastre","La croada"],c:0,e:"Per l'encomanda, el pag\xE8s cedia la seva llibertat a canvi de la seguretat que el senyor li garantia.",qe:"\xBFC\xF3mo se llamaba el sistema por el que el campesino renunciaba a la libertad a cambio de la protecci\xF3n del se\xF1or?",ee:"Por la encomienda, el campesino ced\xEDa su libertad a cambio de la seguridad que el se\xF1or le garantizaba.",oe:["La encomienda","El vasallaje","El catastro","La cruzada"]},{id:"q102",p:"institucions",n:2,q:"Qui va ser el primer president de la Diputaci\xF3 del General (1359)?",o:["Pau Claris","Berenguer de Cru\xEFlles","Rafael Casanova","Guifr\xE9 el Pel\xF3s"],c:1,e:"Berenguer de Cru\xEFlles, bisbe de Girona, presid\xED la Diputaci\xF3 del General nascuda a les Corts de Cervera (1359).",qe:"\xBFQui\xE9n fue el primer presidente de la Diputaci\xF3n del General (1359)?",ee:"Berenguer de Cru\xEFlles, obispo de Girona, presidi\xF3 la Diputaci\xF3n del General nacida en las Cortes de Cervera (1359)."},{id:"q103",p:"institucions",n:3,q:"Quina difer\xE8ncia hi havia entre les Corts Catalanes i la Diputaci\xF3 del General?",o:["Les Corts eren legislatives i la Diputaci\xF3, executiva","Totes dues eren judicials","La Diputaci\xF3 feia lleis i les Corts les aplicaven","No hi havia cap difer\xE8ncia"],c:0,e:"Les Corts eren un \xF2rgan legislatiu; la Diputaci\xF3 del General, un \xF2rgan executiu que aplicava les seves decisions.",qe:"\xBFQu\xE9 diferencia hab\xEDa entre las Cortes Catalanas y la Diputaci\xF3n del General?",ee:"Las Cortes eran un \xF3rgano legislativo; la Diputaci\xF3n del General, un \xF3rgano ejecutivo que aplicaba sus decisiones.",oe:["Las Cortes eran legislativas y la Diputaci\xF3n, ejecutiva","Ambas eran judiciales","La Diputaci\xF3n hac\xEDa leye
